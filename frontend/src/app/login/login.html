<div class="login-container">

  <div class="login-card">

    <h1>ContractIQ</h1>
    <p>Contract Management System</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</div>
