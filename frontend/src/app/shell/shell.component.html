<div class="app-frame"><aside class="sidebar" [class.open]="menuOpen"><div class="sidebar-top"><a class="brand" routerLink="/dashboard" (click)="menuOpen = false"><span class="brand-mark">CI</span><span>ContractIQ</span></a><button class="close-menu" type="button" (click)="menuOpen = false">×</button></div><div class="workspace-label">Workspace / Operations</div><nav aria-label="Primary navigation"><a *ngFor="let item of navigation" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }" (click)="menuOpen = false"><span class="nav-index">{{ item.icon }}</span>{{ item.label }}</a></nav><div class="sidebar-bottom"><div class="status-dot"><span></span> API connected</div><button class="logout" type="button" (click)="auth.logout()">Sign out <span>↗</span></button></div></aside><div class="main-frame"><header class="topbar"><button class="menu-toggle" type="button" aria-label="Open navigation" (click)="menuOpen = true">☰</button><div class="breadcrumb">ContractIQ <span>/</span> Operations</div><div class="user-menu"><span class="role">{{ auth.currentUser()?.role || 'Workspace user' }}</span><span class="avatar">{{ (auth.currentUser()?.role || 'U').slice(0, 1) }}</span></div></header><main class="content"><router-outlet /></main><footer>ContractIQ <span>•</span> Contract intelligence for people who need to move with confidence.</footer></div></div>
