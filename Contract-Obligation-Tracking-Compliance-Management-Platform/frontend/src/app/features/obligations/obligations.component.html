<cq-page-header eyebrow="OBLIGATION TRACKER" title="Contract Obligations" subtitle="Monitor due dates, responsibility and completion status across contracts." />
@if(error){<div class="alert">{{error}}</div>}
<div class="toolbar"><div class="search"><span class="material-icons-round">search</span><input [(ngModel)]="query" (input)="apply()" placeholder="Search obligation or contract ID"></div><select [(ngModel)]="status" (change)="apply()"><option value="">All statuses</option>@for(s of statuses;track s){<option>{{s}}</option>}</select><button class="secondary" (click)="load()">Refresh</button></div>
<div class="table-card">@if(loading){<div class="loading">Loading obligations…</div>}@else{<table><thead><tr><th>Obligation</th><th>Contract</th><th>Type</th><th>Due date</th><th>Status</th><th>Update</th></tr></thead><tbody>@for(x of filtered;track x.id){<tr><td><b>{{x.title}}</b><small>{{x.description || 'No description'}}</small></td><td>#{{x.contract_id}}</td><td>{{x.obligation_type||'—'}}</td><td>{{x.due_date|date:'dd MMM yyyy'}}</td><td><cq-status [label]="x.status"/></td><td><select [value]="x.status" (change)="change(x,$any($event.target).value)">@for(s of statuses;track s){<option>{{s}}</option>}</select></td></tr>}@empty{<tr><td colspan="6"><cq-empty title="No obligations found" message="No obligations matched the current filters."/></td></tr>}</tbody></table>}</div>
