<cq-page-header eyebrow="NOTIFICATION CENTER" title="Notifications" subtitle="Renewal reminders, obligation alerts, compliance events and approval notifications." />
@if(error){<div class="alert">{{error}}</div>}
<div class="panel">@if(loading){<div class="loading">Loading notifications…</div>}@else{@for(x of items;track x.id){<div class="notice" [class.unread]="isUnread(x)"><div class="notice-icon"><span class="material-icons-round">notifications</span></div><div class="notice-body"><div><b>{{x.title||'ContractIQ notification'}}</b><small>{{x.created_at|date:'dd MMM yyyy, HH:mm'}}</small></div><p>{{x.message||'No message supplied.'}}</p><span class="type">{{x.type||x.status||'System alert'}}</span></div>@if(isUnread(x)){<button (click)="markRead(x)">Mark read</button>}</div>}@empty{<cq-empty title="All clear" message="No notifications were returned by the backend." icon="notifications_none"/>}}</div>
