services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: contractiq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [contractiq_pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/contractiq_db
      SECRET_KEY: change-this-in-production
    ports: ["8000:8000"]
    depends_on: [db]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  contractiq_pgdata:
